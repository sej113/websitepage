
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 body{
   
        background-color: black;
        background-image:repeating-linear-gradient(to right, transparent 0 100px, blue 100px 101px),repeating-linear-gradient(to bottom, transparent 0 100px, blue 100px 101px)
     
 }
 .banner{
        width: 100%;
        height: 100vh;
 }
 .slider{
        width: 200px;
        height: 250px;
        position: absolute;
        transform-style: preserve-3d;
        top: 10%;
        left: calc(50% - 100px);
        animation:rotate 8s linear infinite;
     }
     @keyframes rotate{
        from{
            transform: perspective(1000px) rotateX(-20deg) rotateY(0deg);
        }
        to{
         transform: perspective(1000px) rotateX(-20deg) rotateY(360deg);   

        }
    }
    .slider .item{
        position: absolute;
        transform: rotateY(calc((var(--position) - 1) * (360 / var(--quantity) * 1deg))) translateZ(450px);
     }
     img{
        width: 100%;
        height: 100%;
     }
    </style>
</head>
<body>
  
    <section class="banner">
